[project]
name = "agentic-flywheel"
version = "0.1.0"
description = "Agentic Flywheel: an LLM-driven, self-improving MLOps loop around a computer-vision workload."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agentic Flywheel authors" }]

# Core dependencies are intentionally lightweight so the harness and every
# tiny-tier notebook run on a laptop (or this repo's CI) with no GPU.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pylance>=0.9",
    "lancedb>=0.4",
    "daft>=0.5",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# The neural-network training surface. CPU wheels are fine for the tiny tier.
torch = [
    "torch>=2.1",
    "torchvision>=0.16",
]
# Distributed training / search. Used from the small + full tiers (Ch. 8+).
ray = [
    "ray[train,tune]>=2.9",
]
# Slice-based evaluation UI. Optional: the immutable scorer does not need it.
fiftyone = [
    "fiftyone>=0.23",
]
# Notebook execution + book tooling.
dev = [
    "jupyter",
    "nbformat",
    "nbconvert",
    "ipykernel",
    "pytest>=7.4",
    "pytest-timeout",
]

[project.scripts]
mlh-loop = "harness.loop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
